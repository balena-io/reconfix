      footers:
        change-type: patch
      subject: Upgrade resin-image-fs to 4.1.1. Note that this changes the partition
        defn format.
      body: |-
        Changes to images here are because resin-image-fs lists .* files in
        directories from 3.0.0 onwards, and the images contained ._ethernet and
        ._wifi files with assorted bits of OSX binary metadata that broke the
        tests.
        Definitely a major change normally, but leaving as patch since we're
        thoroughly in pre-1.0.0 territory.
